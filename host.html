<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>怖い話・ホスト画面</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>
  <!-- 「怖」が画面全体に出る演出 -->
  <div
    id="scaryOverlay"
    class="scary-overlay"
    aria-hidden="true"
  >
    怖
  </div>

  <main class="host-screen">
    <p class="host-label">ホスト用集計画面</p>

    <h1 class="host-title">怖い話 集計</h1>

    <!-- 音と演出の有効化 -->
    <section class="effect-panel">
      <button
        id="enableEffectsButton"
        class="enable-effects-button"
        type="button"
      >
        音と「怖」演出を有効にする
      </button>

      <p id="effectStatus" class="effect-status">
        開始前に一度押してください
      </p>
    </section>

    <!-- 話のタイトル -->
    <section class="story-panel">
      <label class="story-label" for="storyTitle">
        怖い話のタイトル
      </label>

      <input
        id="storyTitle"
        class="story-input"
        type="text"
        maxlength="40"
        placeholder="例：夜のトンネル"
        autocomplete="off"
      >
    </section>

    <!-- 現在のカウント -->
    <section class="count-panel">
      <p class="count-heading">現在の「怖い！」</p>

      <div class="count-row">
        <span id="countNumber" class="count-number">0</span>
        <span class="count-unit">回</span>
      </div>

      <p id="hostMessage" class="host-message">
        Firebaseに接続しています…
      </p>
    </section>

    <!-- 操作ボタン -->
    <div class="host-actions">
      <button id="saveButton" class="save-button" type="button">
        この話の結果を保存
      </button>

      <button id="resetButton" class="reset-button" type="button">
        保存せず0に戻す
      </button>
    </div>

    <p class="host-note">
      通常は「この話の結果を保存」を押してください。
    </p>

    <!-- ランキング -->
    <section class="ranking-panel">
      <div class="ranking-header">
        <h2 class="ranking-title">
          怖かった話ランキング
        </h2>

        <button
          id="deleteResultsButton"
          class="delete-results-button"
          type="button"
        >
          履歴をすべて削除
        </button>
      </div>

      <ol id="rankingList" class="ranking-list">
        <li class="ranking-empty">
          まだ保存された結果はありません
        </li>
      </ol>
    </section>

    <a class="participant-link" href="index.html">
      参加者画面を開く
    </a>
  </main>

  <script type="module" src="host.js"></script>
</body>
</html>
